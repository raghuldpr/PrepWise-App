name = "prepwise-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The Worker serves the React build and the API from one origin (cookies stay first-party, no CORS).
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "prepwise-db"
database_id = "bc2fb20a-9fb7-41e3-9dca-9295a0db22c7"
migrations_dir = "migrations"

# Optional AI assistant. Off by default. Providers are tried in AI_PROVIDERS order and the next one is used when one
# fails or is out of quota; if none can answer, the page falls back to searching the study material.
#   groq        key:  npx wrangler secret put GROQ_API_KEY
#   workersai   no key: Cloudflare's own AI through the binding below (free daily allowance of 10,000 Neurons)
#   openrouter  key:  npx wrangler secret put OPENROUTER_API_KEY   (free models: 50 requests a day)
# Model names change often: check them with scripts/check-ai-providers.mjs and edit below.
[ai]
binding = "AI"

[vars]
AI_ENABLED = "true"
AI_PROVIDERS = "groq,workersai,openrouter"
# Free quotas are small, so spend them carefully: per student per day, all students per day, and how many
# seconds a provider is skipped after it reports an exhausted quota.
AI_DAILY_LIMIT = "10"
AI_SITE_DAILY_LIMIT = "300"
AI_BREAKER_SECONDS = "120"
GROQ_MODEL = "qwen/qwen3.8-27b"
OPENROUTER_MODEL = "google/gemma-4-31b-it:free"
WORKERSAI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
WORKERSAI_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
